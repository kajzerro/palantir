<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SENTINEL-CI · Analiza wizyjna CCTV · Kopalnia</title>
  <link rel="stylesheet" href="css/app.css" />
</head>
<body>
  <div id="app">

    <!-- ===================== PASEK GÓRNY ===================== -->
    <header id="topbar">
      <div class="site">
        <span class="value">KWK „Wschód-1” · Zmiana B</span>
      </div>
      <div class="kpis">
        <div class="kpi"><span class="label">KAMERY</span><span class="value" id="kpi-cams">0/0</span></div>
        <div class="kpi alert"><span class="label">ALARMY</span><span class="value" id="kpi-alerts">0</span></div>
      </div>
      <div class="clock">
        <span id="clock-date">—</span>
        <span id="clock-time">—</span>
      </div>
    </header>

    <!-- ===================== LEWY PANEL: ASYSTENT ===================== -->
    <section id="terminal" class="panel">
      <div class="panel-head">
        <span class="panel-title">ASYSTENT OCHRONY</span>
        <span class="panel-meta">
          <button class="btn tiny" id="btn-auto" title="Scenariusz odtwarza się sam">AUTO</button>
          <button class="btn tiny" id="btn-next" title="Wywołaj następne zaplanowane zdarzenie">NASTĘPNE ZDARZENIE</button>
        </span>
      </div>
      <div id="term-log" class="term-log" aria-live="polite"></div>
      <div class="quick-bar" id="quick-bar">
        <button type="button" class="qbtn" data-q="status">Co się dzieje?</button>
        <button type="button" class="qbtn" data-q="cams">Pokaż kamery</button>
        <button type="button" class="qbtn" data-q="proc">Co mam teraz robić?</button>
        <button type="button" class="qbtn" data-q="log">Historia zdarzeń</button>
      </div>
    </section>

    <!-- ===================== PRAWY GÓRNY: CYFROWY BLIŹNIAK ===================== -->
    <section id="twin" class="panel">
      <div class="panel-head">
        <span class="panel-title">CYFROWY BLIŹNIAK</span>
        <span class="panel-meta">
          <span class="seg" id="lvl-ctl">
            <button type="button" class="lvl-btn active" data-level="all">Cały obiekt</button>
            <button type="button" class="lvl-btn" data-level="0">Powierzchnia</button>
            <button type="button" class="lvl-btn" data-level="1">−300 m</button>
            <button type="button" class="lvl-btn" data-level="2">−500 m</button>
          </span>
          <span class="legend"><i class="dot ok"></i>ok</span>
          <span class="legend"><i class="dot attn"></i>procedura</span>
          <span class="legend"><i class="dot alert"></i>alarm</span>
          <span class="legend"><i class="dot off"></i>offline</span>
          <span class="zoom-ctl"><button class="btn tiny" id="btn-zout" title="Oddal">−</button><button class="btn tiny" id="btn-zin" title="Przybliż">+</button><button class="btn tiny" id="btn-zreset" title="Cały obiekt">⟲</button></span>
        </span>
      </div>
      <div class="twin-wrap">
        <div class="twin-svg-wrap">
          <svg id="mine-svg" viewBox="0 0 680 480" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Cyfrowy bliźniak kopalni – ortofotomapa z warstwami wyrobisk">
            <defs>
              <pattern id="coalhatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(-30)">
                <line x1="0" y1="0" x2="0" y2="6" stroke="rgba(140,180,210,0.25)" stroke-width="1"/>
              </pattern>
              <filter id="glow"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
            </defs>
            <g id="scene"></g>
          </svg>
          <div id="twin-tooltip" class="tooltip" hidden></div>
        </div>
      </div>
    </section>

    <!-- ===================== PRAWY DOLNY: PODGLĄD NA ŻYWO ===================== -->
    <section id="feed" class="panel">
      <div class="panel-head">
        <span class="panel-title">PODGLĄD NA ŻYWO · <span id="feed-cam-id">—</span></span>
        <span class="panel-meta">
          <span class="rec"><i></i>REC</span>
          <span class="pill" id="feed-status">BEZCZYNNY</span>
          <button class="btn tiny" id="btn-fullscreen" title="Pełny ekran">⛶</button>
        </span>
      </div>
      <div class="feed-body">
        <div class="feed-main">
          <video id="feed-video" muted autoplay loop playsinline></video>
          <canvas id="feed-noise"></canvas>
          <div id="feed-overlay" class="overlay"></div>
          <div class="feed-osd top-left"><span id="osd-cam">NIE WYBRANO KAMERY</span></div>
          <div class="feed-osd top-right"><span id="osd-time">--:--:--</span></div>
          <div class="feed-osd bottom-left"><span id="osd-zone">kliknij punkt kamery na modelu 3D</span></div>
          <div id="feed-placeholder" class="feed-placeholder">
            <div class="nosig">BRAK SYGNAŁU</div>
            <div class="nosig-sub" id="nosig-sub">wybierz kamerę</div>
          </div>
        </div>
        <aside class="feed-side">
          <div class="side-block">
            <div class="side-title">DETEKCJE</div>
            <ul id="feed-detections" class="det-list"><li class="muted">—</li></ul>
          </div>
          <div class="side-block">
            <div class="side-title">KAMERA</div>
            <dl class="side-kv" id="feed-meta">
              <dt>strefa</dt><dd>—</dd>
              <dt>typ</dt><dd>—</dd>
            </dl>
          </div>
          <div class="side-block grow">
            <div class="side-title">OSTATNIE ZDARZENIA</div>
            <ul id="feed-events" class="ev-list"></ul>
          </div>
        </aside>
      </div>
    </section>

  </div>

  <script src="js/site.js"></script>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
